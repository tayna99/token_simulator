name: Official Watchtower

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  official-watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run research:official-watch
